  <!-- Set the theme before first paint. app.js is at the end of <body>, so
       without this a reader on dark mode gets a full white flash on every page
       load. Inline and tiny on purpose: an external file would be one more
       blocking round-trip in front of the paint. -->
  <script>
    (function () {
      /* Only the storage read is guarded. Wrapping the whole thing meant a
         throwing getItem (Safari private mode, blocked site data) also skipped
         the system-preference fallback AND the setAttribute — so the page kept
         the markup's data-theme="light" until app.js flipped it at the end of
         <body>, which is the exact flash this script exists to prevent, for
         the readers least able to avoid it: storage blocked means their
         preference can never be cached, so it happened on every load. */
      var t = null;
      try { t = localStorage.getItem("theme"); } catch (e) { /* storage blocked */ }
      if (!t) {
        t = window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>

  <!-- The Traditional Chinese faces are 203KB of CSS on their own (687
       @font-face subsets, since Google Fonts splits CJK by unicode-range) —
       99% of what the font request used to cost, and it was blocking first
       paint on all 40 pages. An English page renders three CJK characters in
       total, in the language switch, which any system font covers.

       So: fetch it only on the Chinese twins, and even there without blocking
       the paint (media="print" until it arrives). The head stays identical on
       both languages so build_i18n.py can keep generating one from the other.
       System CJK fallbacks are already in --font-body, so nothing renders
       blank while this is in flight. -->
  <script>
    (function () {
      if ((document.documentElement.lang || "").toLowerCase().indexOf("zh") !== 0) return;
      var l = document.createElement("link");
      l.rel = "stylesheet";
      l.media = "print";
      l.onload = function () { this.onload = null; this.media = "all"; };
      l.href = "https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700" +
               "&family=Noto+Serif+TC:wght@500;600;700&display=swap";
      document.head.appendChild(l);
    })();
  </script>
